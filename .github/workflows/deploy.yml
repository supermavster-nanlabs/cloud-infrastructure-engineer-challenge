name: deploy

# Run from the Actions tab: choose an environment, a region and an action.
# It runs the same make targets as a local deploy. Setup: docs/github-actions.md.
on:
  # checkov:skip=CKV_GHA_7: this deploys infrastructure and publishes no build artifact; the inputs are its interface
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (settings in terraform/environments, secrets in the GitHub environment of the same name)
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      region:
        description: AWS region to deploy into
        type: choice
        options: [us-east-1, us-east-2, us-west-2, eu-west-1, eu-central-1, sa-east-1]
        default: us-east-1
        required: true
      action:
        description: What to do. apply and destroy plan first, then apply that plan in the same run
        type: choice
        options: [plan, apply, destroy, unlock]
        default: plan
        required: true
      confirm:
        description: "destroy and unlock only: type the environment name to confirm"
        type: string
        required: false
      lock_id:
        description: "unlock only: the lock ID printed by the 'state is locked' error"
        type: string
        required: false

permissions:
  contents: read

# Never cancel a run that is changing infrastructure; queue the next one instead.
concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.region }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.15.9"

jobs:
  run:
    name: ${{ inputs.action }} ${{ inputs.environment }} (${{ inputs.region }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ENV: ${{ inputs.environment }}
      REGION: ${{ inputs.region }}
      ACTION: ${{ inputs.action }}
      CONFIRM: ${{ inputs.confirm }}
      LOCK_ID: ${{ inputs.lock_id }}
      STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
      # Not named AWS_ROLE_ARN: the AWS SDK reads that name. A secret cannot be tested in an if, an env var can.
      DEPLOY_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      STATE_REGION: ${{ vars.STATE_REGION || 'us-east-1' }}
    steps:
      - name: Check the inputs
        run: |
          set -euo pipefail
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::Set the STATE_BUCKET secret (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          if [ "${ACTION}" = destroy ] || [ "${ACTION}" = unlock ]; then
            if [ "${CONFIRM}" != "${ENV}" ]; then
              echo "::error::To ${ACTION}, type '${ENV}' in the confirm input."
              exit 1
            fi
          fi
          if [ "${ACTION}" = unlock ] && ! [[ "${LOCK_ID}" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::lock_id must be the lock ID printed by Terraform (a UUID)."
            exit 1
          fi

      - name: Check AWS access is configured
        env:
          AWS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "${DEPLOY_ROLE_ARN}" ] && [ -z "${AWS_KEY_ID}" ]; then
            echo "::error::Set the AWS_ROLE_ARN secret (OIDC) or the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: ${{ env.DEPLOY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          mask-aws-account-id: true

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: ${{ env.DEPLOY_ROLE_ARN == '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Run
        run: |
          set -euo pipefail
          case "${ACTION}" in
            plan)    make plan ;;
            apply)   make plan && make apply ;;
            destroy) make plan PLAN_FLAGS=-destroy && make apply ;;
            unlock)  make unlock ;;
          esac

      - name: Show the endpoint
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Endpoint: $(terraform -chdir=terraform output -raw info_url)" >> "${GITHUB_STEP_SUMMARY}"
