services:
  db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: ${DB_USER:?copy local/.env.example to local/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?copy local/.env.example to local/.env}
      POSTGRES_DB: ${DB_NAME:?copy local/.env.example to local/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15
